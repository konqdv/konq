<svg xmlns="http://www.w3.org/2000/svg" width="80" height="240" viewBox="0 0 80 240">
  <defs>
    <radialGradient id="face" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#bfe6ff"/>
      <stop offset="42%" stop-color="#54a8e8"/>
      <stop offset="78%" stop-color="#1f6fb8"/>
      <stop offset="100%" stop-color="#0d3f75"/>
    </radialGradient>
    <radialGradient id="faceHover" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#e8f8ff"/>
      <stop offset="42%" stop-color="#86d0f8"/>
      <stop offset="78%" stop-color="#3593de"/>
      <stop offset="100%" stop-color="#12518f"/>
    </radialGradient>
    <radialGradient id="faceActive" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8ec4e8"/>
      <stop offset="45%" stop-color="#2f79b4"/>
      <stop offset="100%" stop-color="#082c55"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <g id="glyph" fill="#fff" opacity=".95">
      <rect x="31" y="31" width="7.5" height="7.5" rx="1.4"/>
      <rect x="41.5" y="31" width="7.5" height="7.5" rx="1.4"/>
      <rect x="31" y="41.5" width="7.5" height="7.5" rx="1.4"/>
      <rect x="41.5" y="41.5" width="7.5" height="7.5" rx="1.4"/>
    </g>
  </defs>

  <!-- Frame 1 (y 0): idle -->
  <g>
    <circle cx="40" cy="40" r="31" fill="#fff" opacity=".28"/>
    <circle cx="40" cy="40" r="29" fill="#0a2c52" opacity=".55"/>
    <circle cx="40" cy="40" r="27" fill="url(#face)"/>
    <ellipse cx="40" cy="26" rx="20" ry="12" fill="url(#gloss)"/>
    <use href="#glyph"/>
  </g>

  <!-- Frame 2 (y 80): hover -->
  <g transform="translate(0,80)">
    <circle cx="40" cy="40" r="32" fill="#fff" opacity=".42"/>
    <circle cx="40" cy="40" r="29" fill="#0a2c52" opacity=".5"/>
    <circle cx="40" cy="40" r="27" fill="url(#faceHover)"/>
    <ellipse cx="40" cy="26" rx="21" ry="13" fill="url(#gloss)"/>
    <use href="#glyph"/>
  </g>

  <!-- Frame 3 (y 160): pressed -->
  <g transform="translate(0,160)">
    <circle cx="40" cy="40" r="30" fill="#fff" opacity=".2"/>
    <circle cx="40" cy="40" r="29" fill="#061f3d" opacity=".65"/>
    <circle cx="40" cy="40" r="26" fill="url(#faceActive)"/>
    <ellipse cx="40" cy="28" rx="16" ry="9" fill="url(#gloss)" opacity=".6"/>
    <use href="#glyph"/>
  </g>
</svg>
